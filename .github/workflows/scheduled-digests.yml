name: Scheduled digest runs

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-digests:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest runs
        run: |
          curl -sS -X POST https://sift-api-sxg1.onrender.com/cron/run-digests \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 900 \
            --fail-with-body
